<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- FIXED: Added user-scalable=no to prevent accidental UI zooming during the presentation -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lunar Orbit Lab</title>

  <!-- NATIVE APP KIOSK MODE TAGS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="top-bar">
    <h1 class="logo">Lunar Orbit Lab</h1>
    <p class="subtitle">Kinematics & Phase Simulation</p>
  </div>

  <div id="top-left-ui">
    <div id="solar-modes" class="glass-panel">
      <div class="mode-title">Eclipse Distance</div>
      <div class="btn-group">
        <button class="action-btn" id="btn-perigee">Perigee (Total)</button>
        <button class="action-btn active" id="btn-apogee">Apogee (Annular)</button>
      </div>
    </div>

    <div id="tidal-modes" class="glass-panel">
      <div class="mode-title">Tidal Simulation</div>
      <div class="btn-group">
        <button class="action-btn active" id="btn-tidal-true">True Locked</button>
        <button class="action-btn" id="btn-tidal-zero">Zero Rotation</button>
      </div>
    </div>
  </div>

  <div id="canvas-container"></div>

  <div id="info-panel" class="glass-panel">
    <div class="panel-top-row">
      <div id="telescope-wrapper">
        <canvas id="telescope-canvas"></canvas>
        <div class="reticle"></div>
      </div>

      <div class="phase-card">
        <div id="phase-title">New Moon</div>
        <div id="phase-illumination">0% Illumination</div>
        <div id="phase-description">The unlit side faces Earth.</div>
      </div>
    </div>

    <div class="quick-jump">
      <div class="btn-grid phases">
        <button class="action-btn phase-btn">New</button>
        <button class="action-btn phase-btn">Wax. Crescent</button>
        <button class="action-btn phase-btn">1st Qtr</button>
        <button class="action-btn phase-btn">Wax. Gibbous</button>
        <button class="action-btn phase-btn">Full</button>
        <button class="action-btn phase-btn">Wan. Gibbous</button>
        <button class="action-btn phase-btn">3rd Qtr</button>
        <button class="action-btn phase-btn">Wan. Crescent</button>
      </div>
    </div>

    <div class="calendar-jump">
      <button class="action-btn" id="btn-live-date">Live</button>
      <input type="date" id="calendar-picker">
    </div>

    <button class="action-btn full-width" id="btn-tidal-toggle">Tidal Locking Simulation</button>

    <div class="action-grid views">
      <button class="action-btn" id="btn-solar">Solar Ecl.</button>
      <button class="action-btn" id="btn-lunar">Lunar Ecl.</button>
      <button class="action-btn" id="btn-earth-surf">Earth View</button>
      <button class="action-btn" id="btn-moon-surf">Moon View</button>
      <button class="action-btn full-width" id="btn-shadows">Toggle Shadows</button>
    </div>

    <div class="eclipse-control" id="eclipse-control-box">
      <div class="btn-grid">
        <button class="action-btn active" id="btn-ecl-total">Total</button>
        <button class="action-btn" id="btn-ecl-partial">Partial</button>
      </div>
    </div>
  </div>

  <div id="control-bar" class="glass-panel">
    <button id="play-pause-btn" class="ctrl-btn main">Pause</button>
    <div class="slider-group">
      <label for="speed-slider">Speed</label>
      <input type="range" id="speed-slider" min="0.1" max="3.0" step="0.1" value="1.0">
    </div>
    <div class="slider-group">
      <label for="phase-slider">Orbit</label>
      <input type="range" id="phase-slider" min="0" max="6.283" step="0.01" value="0">
    </div>
    <button id="reset-cam-btn" class="ctrl-btn">Reset</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
